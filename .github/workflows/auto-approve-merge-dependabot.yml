name: auto approve + merge dependabot prs

on:
  pull_request_target:
    branches:
      - main
    types:
      - labeled
      - synchronize
  check_suite:
    types:
      - completed
  status: {}

jobs:
  auto-approve:
    name: Auto approve Dependabot PRs
    runs-on: ubuntu-latest
    # Dependabot's two labels fire two concurrent runs. Serialize them per
    # PR so the second sees the first's approval rather than racing it.
    concurrency:
      group: dependabot-approve-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    if: |
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == 'dependabot' ||
        github.event.pull_request.user.login == 'dependabot-preview[bot]' ||
        github.event.pull_request.user.login == 'dependabot-preview'
      ) && (
        github.actor == 'dependabot[bot]' ||
        github.actor == 'dependabot' ||
        github.actor == 'dependabot-preview[bot]' ||
        github.actor == 'dependabot-preview'
      )
    steps:
      - name: Approve
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PR_URL: "${{ github.event.pull_request.html_url }}"
        # Dependabot assigns two labels and GitHub fires a separate
        # `labeled` event for each, so this job runs more than once
        # per PR. Re-approving returns 422 and fails the run.
        run: |
          states=$(gh pr view "$PR_URL" --json reviews \
            --jq '.reviews[] | select(.author.login == "github-actions[bot]") | .state')
          case "$states" in
            *APPROVED*) echo "Already approved; nothing to do." ;;
            *) gh pr review --approve "$PR_URL" ;;
          esac
  auto-merge:
    name: Auto merge Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    needs: auto-approve
    if: |
      github.actor == 'dependabot[bot]' ||
      github.actor == 'dependabot' ||
      github.actor == 'dependabot-preview[bot]' ||
      github.actor == 'dependabot-preview'
    steps:
      - name: Retrieve Dependabot metadata
        id: dependabot-metadata
        uses: "dependabot/fetch-metadata@v3.1.0"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Wait for status checks
        id: wait-for-status-checks
        uses: "wyrihaximus/github-action-wait-for-status@v1.8.0"
        with:
          ignoreActions: "Auto merge Dependabot PRs"
          checkInterval: 30
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Auto merge
        if: |
          steps.wait-for-status-checks.outputs.status == 'success' &&
          steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PR_URL: "${{ github.event.pull_request.html_url }}"
        # dependabot.yml labels only the ecosystems that opt in with "automerge".
        run: |
          labels=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')
          if ! grep -qx automerge <<< "$labels" || grep -qx major <<< "$labels"; then
            echo "Not labeled automerge, or labeled major; leaving it open."
            exit 0
          fi
          gh pr merge "$PR_URL" --squash --body "$(gh pr view "$PR_URL" --json body --jq .body)"
